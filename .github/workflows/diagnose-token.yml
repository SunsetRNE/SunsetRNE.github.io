# 一次性诊断：确认 SYNC_TOKEN 的身份与对 actions-data 的权限
name: Diagnose SYNC_TOKEN

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose token
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "=== 1. token 身份 ==="
          curl -s -H "Authorization: Bearer ${TOKEN}" https://api.github.com/user \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('login:', d.get('login'), '| id:', d.get('id'), '| name:', d.get('name'))"
          echo "=== 2. actions-data 仓库访问 ==="
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/SunsetRNE/actions-data)
          echo "GET repos/actions-data : $code"
          head -c 200 /tmp/r.json; echo
          echo "=== 3. actions-data Pages 读取 ==="
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/SunsetRNE/actions-data/pages)
          echo "GET pages : $code"
          head -c 200 /tmp/p.json; echo
          echo "=== 4. 直接开 Pages ==="
          code=$(curl -s -o /tmp/x.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SunsetRNE/actions-data/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "POST pages : $code"
          cat /tmp/x.json; echo