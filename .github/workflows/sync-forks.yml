# Fork 上游监控 + 自动同步
# 每天自动运行：同步所有 fork 仓库的上游更新，并生成监控报告
#
# ⚠️ 首次使用前需要配置 SYNC_TOKEN（仓库 Secrets）：
#   GitHub → Settings → Developer settings → Personal access tokens →
#   Fine-grained tokens → 生成一个具有 repo 写权限的 token →
#   存到本仓库 Settings → Secrets and variables → Actions → New secret
#   名称填 SYNC_TOKEN

name: Sync Forks

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch: # 支持手动触发
    inputs:
      repos:
        description: "仅同步指定仓库名（逗号分隔，留空 = 全部）"
        required: false
        default: ""
      skip_repos:
        description: "跳过的仓库名（逗号分隔，如大型内核仓库）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-forks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Fork Sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          USERNAME: SunsetRNE
          REPOS: ${{ inputs.repos || '' }}
          SKIP_REPOS: ${{ inputs.skip_repos || '' }}
          # 编译依赖类仓库（toolchain/ccache/manifest/AnyKernel）因编译而存在，无需跟上游
          SKIP_CATEGORIES: "编译依赖"
        run: python3 .github/scripts/sync_forks.py

      - name: Commit Report
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "SunsetRNE"
          git config user.email "z100o190zgxc@163.com"
          git add docs/public/fork-status.json
          git diff --cached --quiet || git commit -m "chore: update fork sync report"
          # ⚠️ 必须清除 extraheader：actions/checkout 注入的 GITHUB_TOKEN
          # 会覆盖 URL 里的 SYNC_TOKEN，导致 push 用 GITHUB_TOKEN 认证，
          # 而 GITHUB_TOKEN 的 push 不会触发其他 workflow（递归防护）
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          # 双保险：显式触发 Deploy Pages（workflow_dispatch 事件 100% 生效）
          # ⚠️ 用 GITHUB_TOKEN：fine-grained token 无 Actions 权限会 403
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'