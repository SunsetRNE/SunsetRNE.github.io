# 一次性工具：用 API 开启 actions-data 的 GitHub Pages（branch 模式）
# 手动触发一次即可；成功后删除本文件
name: Enable actions-data Pages

on:
  workflow_dispatch:

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages via API
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/SunsetRNE/actions-data/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "HTTP $code"
          cat /tmp/pages.json
          if [ "$code" = "403" ]; then
            echo "::error::SYNC_TOKEN 无权限——需要 classic PAT 或 fine-grained token 给 actions-data 加写权限"
            exit 1
          fi
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::开启失败（HTTP $code）"
            exit 1
          fi
          echo "✅ Pages 已开启（201=新建，409=已存在）"