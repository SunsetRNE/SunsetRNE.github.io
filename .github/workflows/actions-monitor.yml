# Actions 监控快照
# 每 30 分钟扫描一次账号下所有公开仓库的 Actions 运行状态，
# 生成快照 docs/public/actions-runs.json 供监控页（/actions）读取。
#
# 只读 API + 有状态变化才提交：runs 状态无变化时脚本不写文件，
# git diff 为空 → 跳过 commit/push/deploy，不污染历史也不触发无谓部署。
# API 用量：约 56 次/轮 × 48 轮/天 ≈ 2700 次/天（SYNC_TOKEN 限额 5000/小时）
#
# ⚠️ 依赖 SYNC_TOKEN（与 sync-forks 同一个 secret）：
#   GitHub → Settings → Developer settings → Personal access tokens

name: Actions Monitor

on:
  schedule:
    - cron: "*/30 * * * *" # 每 30 分钟（UTC 偶数分，北京时间 偶数分+8）
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: actions-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Scan Actions Runs
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          USERNAME: SunsetRNE
        run: python3 .github/scripts/actions_monitor.py

      - name: Commit Snapshot (only on change)
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "SunsetRNE"
          git config user.email "z100o190zgxc@163.com"
          git add docs/public/actions-runs.json
          if git diff --cached --quiet; then
            echo "📭 runs 状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update actions monitor snapshot"
          # ⚠️ 必须清除 extraheader：actions/checkout 注入的 GITHUB_TOKEN
          # 会覆盖 URL 里的 SYNC_TOKEN，导致 push 用 GITHUB_TOKEN 认证，
          # 而 GITHUB_TOKEN 的 push 不会触发其他 workflow（递归防护）
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          # 双保险：显式触发 Deploy Pages（workflow_dispatch 事件 100% 生效）
          # ⚠️ 用 GITHUB_TOKEN：fine-grained token 无 Actions 权限会 403
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
