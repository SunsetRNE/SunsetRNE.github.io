# 自动构建并部署到 GitHub Pages
# 参考 ReSukiSU.github.io 的 main.yml 精简而来
name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - package.json
      - bun.lock
      - .github/workflows/deploy.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run --bun docs:build
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Diagnose Pages Deployments (temporary)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo '=== 最近 10 条 pages deployments ==='
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/SunsetRNE/SunsetRNE.github.io/pages/deployments?per_page=10" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(x.get("id"), "|", x.get("status"), "|", x.get("created_at")) for x in d] if isinstance(d,list) else print(d)'
          echo '=== 当前 Pages 配置 ==='
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/SunsetRNE/SunsetRNE.github.io/pages" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ["build_type","status","html_url","source"]}, indent=1))'
          exit 0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
