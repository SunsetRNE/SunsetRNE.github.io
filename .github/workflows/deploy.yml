# 自动构建并部署到 GitHub Pages（分支模式）
# 2026-08-06 切换：actions/deploy-pages 的 deployment API 通道连续 5 次卡死
# （deployment_in_progress 10 分钟超时），改为 gh-pages 分支发布——
# 与 actions-data 同通道（push 后 1-2 分钟生效，已验证可靠）
name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - package.json
      - bun.lock
      - .github/workflows/deploy.yml

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run --bun docs:build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
