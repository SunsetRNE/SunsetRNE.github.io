<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SunsetRNE 个人工作站</title>
  <style>
    :root {
      --brand: #5b5bd6;
      --brand-2: #8b5cf6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7fb;
      font-family: "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .links a {
      display: block;
      text-decoration: none;
      color: #333;
      border: 1px solid #e4e4ee;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .links a:hover {
      border-color: var(--brand);
      color: var(--brand);
      transform: translateY(-1px);
    }
    .tip {
      margin-top: 24px;
      font-size: 12px;
      color: #999;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌅 SunsetRNE 个人工作站</h1>
    <p class="sub">VitePress 驱动的个人站点 · Fork 上游自动同步监控</p>
    <div class="links">
      <a href="https://sunsetrne.github.io" target="_blank" rel="noopener">🌐 访问线上站点</a>
      <a href="https://github.com/SunsetRNE/SunsetRNE.github.io" target="_blank" rel="noopener">📦 查看源码仓库</a>
      <a href="https://github.com/SunsetRNE" target="_blank" rel="noopener">👤 我的 GitHub</a>
    </div>
    <p class="tip">
      本站点基于 VitePress 构建。<br />
      本地开发：<code>pnpm run docs:dev</code> → http://localhost:5173<br />
      本页面是工作区预览入口（index.html），站点内容在 <code>docs/</code> 目录。
    </p>
  </div>
</body>
</html>
